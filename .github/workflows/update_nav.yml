name: Auto Update NAV Daily

on:
  schedule:
  - cron: '50 15 * * 1-5'
    timezone: "Asia/Bangkok"
  workflow_dispatch: # ปุ่มกดรันแบบ manual สำหรับทดสอบ

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests supabase beautifulsoup4

      - name: Run NAV Update Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_nav.py
