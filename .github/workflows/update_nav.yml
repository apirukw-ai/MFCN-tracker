name: Auto Update NAV Daily

on:
  schedule:
    # 09:15 UTC = 16:15 น. ไทย (จันทร์-ศุกร์)
    - cron: '15 9 * * 1-5'
  workflow_dispatch: # ปุ่มกดรันแบบ manual สำหรับทดสอบ

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4  # แก้ไข setup-python ให้ถูกต้อง
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests supabase beautifulsoup4

      - name: Run NAV Update Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_nav.py
