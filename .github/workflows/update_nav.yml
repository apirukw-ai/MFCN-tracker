name: Auto Update NAV Daily

on:
  schedule:
    # รันทุกวันจันทร์ - ศุกร์ เวลา 20:00 น. (เวลาไทย)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # กดสั่งรันเองได้ผ่านหน้าเว็บ

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests supabase beautifulsoup4

      - name: Run Fetch NAV Script
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_nav.py
