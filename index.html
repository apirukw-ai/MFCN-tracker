<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFC Policies Cloud Sync</title>
    <!-- Tailwind CSS สำหรับจัดแต่งหน้าตา -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mfc: {
                            orange: '#f97316',
                            hover: '#ea580c'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-2xl mx-auto bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-4 text-orange-400">ระบบจัดการ MFC Policies</h1>
        
        <!-- สถานะการเชื่อมต่อ -->
        <div id="status" class="mb-4 p-3 text-sm rounded-xl bg-slate-700 text-slate-300">
            สถานะ: กำลังเตรียมการ...
        </div>

        <!-- รายการข้อมูล -->
        <div class="space-y-3 mb-6" id="policyList">
            <!-- ข้อมูลจะแสดงตรงนี้ -->
        </div>

        <!-- ปุ่มกดบันทึก -->
        <div class="flex justify-end space-x-2 pt-4 border-t border-slate-700 mt-2">
            <button type="button" id="btnCancelModal" class="px-4 py-2 rounded-xl text-slate-400 hover:text-slate-200">ยกเลิก</button>
            <button type="button" onclick="saveDataToCloud()" class="px-5 py-2 rounded-xl bg-mfc-orange hover:bg-mfc-hover text-white font-medium shadow-lg">บันทึก</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ป้อนข้อมูล Supabase ของคุณตรงนี้
        // ==========================================
        const SUPABASE_URL = 'https://iproktvvetsbxxmpptuj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlwcm9rdHZ2ZXRzYnh4bXBwdHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTU3NDEsImV4cCI6MjEwMjg3MTc0MX0.Kc0USo30u4gvZNJ1bsOdD9k6nwEBcY7lNMAQxWEFzqw';

        // ==========================================
        // 2. สร้าง Client สำหรับเชื่อมต่อ Supabase
        // ==========================================
        let supabaseClient = null;
        let policies = [
            { id: 1, policy_name: "MFC Policy A", nav: 10.5, units: 100, amount: 1050 },
            { id: 2, policy_name: "MFC Policy B", nav: 25.0, units: 200, amount: 5000 }
        ];

        try {
            if (SUPABASE_URL !== "วาง_PROJECT_URL_ที่นี่" && SUPABASE_ANON_KEY !== "วาง_ANON_KEY_ที่นี่") {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                document.getElementById('status').innerText = "สถานะ: เชื่อมต่อ Supabase พร้อมใช้งาน";
                document.getElementById('status').className = "mb-4 p-3 text-sm rounded-xl bg-emerald-900/50 text-emerald-300 border border-emerald-700";
            } else {
                document.getElementById('status').innerText = "สถานะ: ยังไม่ได้ใส่ Supabase URL หรือ Key ในโค้ด";
                document.getElementById('status').className = "mb-4 p-3 text-sm rounded-xl bg-amber-900/50 text-amber-300 border border-amber-700";
            }
        } catch (err) {
            console.error("Initialization Error:", err);
            document.getElementById('status').innerText = "สถานะ: เชื่อมต่อล้มเหลว ตรวจสอบ URL/Key";
        }

        // ==========================================
        // 3. ฟังก์ชันแสดงผลบนหน้าจอ
        // ==========================================
        function renderPolicies() {
            const container = document.getElementById('policyList');
            container.innerHTML = '';
            
            policies.forEach((item, index) => {
                container.innerHTML += `
                    <div class="p-3 bg-slate-700/50 rounded-xl flex justify-between items-center border border-slate-600">
                        <div>
                            <p class="font-bold text-slate-200">${item.policy_name}</p>
                            <p class="text-xs text-slate-400">NAV: ${item.nav} | Units: ${item.units}</p>
                        </div>
                        <div class="text-right">
                            <input type="number" step="0.01" value="${item.nav}" 
                                onchange="updateNav(${index}, this.value)"
                                class="bg-slate-900 text-amber-400 px-3 py-1 rounded-lg w-28 text-right border border-slate-600 focus:outline-none focus:border-orange-500">
                        </div>
                    </div>
                `;
            });
        }

        // อัปเดตค่า NAV เมื่อมีการแก้ไขตัวเลขบนหน้าจอ
        function updateNav(index, newValue) {
            policies[index].nav = parseFloat(newValue) || 0;
            policies[index].amount = policies[index].nav * policies[index].units;
            console.log("อัปเดตข้อมูลในหน่วยความจำ:", policies[index]);
        }

        // ==========================================
        // 4. ฟังก์ชันดึงข้อมูลล่าสุดจาก Supabase (Fetch)
        // ==========================================
        async function fetchCloudData() {
            if (!supabaseClient) return;

            try {
                const { data, error } = await supabaseClient
                    .from('mfc_policies')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) {
                    console.error("Fetch Error:", error);
                } else if (data && data.length > 0) {
                    policies = data;
                    renderPolicies();
                    console.log("ดึงข้อมูลจาก Cloud สำเร็จ:", data);
                }
            } catch (err) {
                console.error("System Error:", err);
            }
        }

        // ==========================================
        // 5. ฟังก์ชันส่งข้อมูลลง Supabase (Save)
        // ==========================================
        async function saveDataToCloud() {
            console.log("👉 เริ่มทำงาน: กดปุ่มบันทึกแล้ว");

            if (!supabaseClient) {
                alert("ยังไม่ได้เชื่อมต่อ Supabase! กรุณาใส่ URL และ Key ในไฟล์ index.html ก่อน");
                return;
            }

            if (!policies || policies.length === 0) {
                alert("ไม่มีข้อมูลในตารางที่จะบันทึก");
                return;
            }

            try {
                console.log("กำลังส่งข้อมูลไป mfc_policies:", policies);

                const { data, error } = await supabaseClient
                    .from('mfc_policies')
                    .upsert(policies);

                if (error) {
                    console.error("บันทึกล้มเหลว:", error);
                    alert("บันทึกล้มเหลว: " + error.message);
                } else {
                    console.log("บันทึกสำเร็จ:", data);
                    alert("บันทึกข้อมูลลง Cloud เรียบร้อยแล้ว!");
                    await fetchCloudData(); // โหลดข้อมูลใหม่มายืนยันอีกครั้ง
                }
            } catch (err) {
                console.error("เกิดข้อผิดพลาดในการเชื่อมต่อ:", err);
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
            }
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        window.onload = () => {
            renderPolicies();
            if (supabaseClient) {
                fetchCloudData();
            }
        };
    </script>
</body>
</html>
