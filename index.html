<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFC Provident Fund Dashboard</title>
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Supabase JS SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 font-sans antialiased">

  <!-- Config & Script -->
  <script>
    const SUPABASE_URL = 'https://iproktvvetsbxmpptuj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlwcm9rdHZ2ZXRzYnh4bXBwdHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTU3NDEsImV4cCI6MjEwMjg3MTc0MX0.Kc0USo30u4gvZNJ1bsOdD9k6nwEBcY7lNMAQxWEFzqw
';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let policies = [];

    document.addEventListener('DOMContentLoaded', fetchPolicies);

    async function fetchPolicies() {
      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.classList.remove('hidden');

      const { data, error } = await db.from('policies').select('*').order('id', { ascending: true });
      
      if (loadingEl) loadingEl.classList.add('hidden');

      if (error) {
        console.error('Error fetching policies:', error);
        alert('เกิดข้อผิดพลาดในการโหลดข้อมูล');
        return;
      }

      policies = data || [];
      renderSummary();
      renderTable();
    }

    function renderSummary() {
      const totalBalance = policies.reduce((acc, item) => acc + (item.units * item.nav), 0);
      const totalCost = policies.reduce((acc, item) => acc + Number(item.cost), 0);
      const totalProfit = totalBalance - totalCost;
      const totalProfitPct = totalCost > 0 ? (totalProfit * 100) / totalCost : 0;

      // ฟอร์แมตทศนิยม 2 ตำแหน่งให้ถูกต้อง
      const fmt = (num) => Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      document.getElementById('total-balance').innerText = '฿' + fmt(totalBalance);
      document.getElementById('total-cost').innerText = '฿' + fmt(totalCost);
      
      const profitEl = document.getElementById('total-profit');
      profitEl.innerText = `฿${fmt(totalProfit)} (${totalProfitPct >= 0 ? '+' : ''}${totalProfitPct.toFixed(2)}%)`;
      profitEl.className = `text-base sm:text-lg font-bold mt-1 ${totalProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (policies.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-500">ยังไม่มีข้อมูลในระบบ</td></tr>`;
        return;
      }

      const fmt = (num) => Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      policies.forEach(item => {
        const currentVal = item.units * item.nav;
        const profitPct = item.cost > 0 ? ((currentVal - item.cost) * 100) / item.cost : 0;

        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/50 transition-colors border-b border-slate-800/60';
        row.innerHTML = `
          <td class="py-3.5 px-2">
            <span class="font-bold text-orange-500 block text-sm sm:text-base">${item.code}</span>
            <span class="text-[11px] text-slate-400 tracking-wide">${item.name}</span>
          </td>
          <td class="py-3.5 px-2 text-center font-mono text-slate-200">${Number(item.units).toLocaleString(undefined, { minimumFractionDigits: 4 })}</td>
          <td class="py-3.5 px-2 text-right font-mono font-bold text-amber-400">${Number(item.nav).toFixed(4)}</td>
          <td class="py-3.5 px-2 text-right font-bold text-slate-100">฿${fmt(currentVal)}</td>
          <td class="py-3.5 px-2 text-right font-bold ${profitPct >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
            ${profitPct >= 0 ? '+' : ''}${profitPct.toFixed(2)}%
          </td>
          <td class="py-3.5 px-2 text-right font-bold ${item.ytd >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
            ${item.ytd >= 0 ? '+' : ''}${Number(item.ytd).toFixed(2)}%
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function handleAddPolicy(e) {
      e.preventDefault();
      const code = document.getElementById('input-code').value;
      const name = document.getElementById('input-name').value;
      const units = parseFloat(document.getElementById('input-units').value) || 0;
      const nav = parseFloat(document.getElementById('input-nav').value) || 0;
      const cost = parseFloat(document.getElementById('input-cost').value) || 0;
      const ytd = parseFloat(document.getElementById('input-ytd').value) || 0;

      const { error } = await db.from('policies').insert([
        { code, name, units, nav, prev_amt: 0, cost, ytd }
      ]);

      if (!error) {
        toggleModal(false);
        document.getElementById('add-form').reset();
        fetchPolicies();
      } else {
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
      }
    }

    function toggleModal(show) {
      const modal = document.getElementById('modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }
  </script>

  <!-- Container -->
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex justify-between items-center pb-2 border-b border-slate-800/80">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-500">
          MFC Provident Fund
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">ระบบบันทึกพอร์ต NU DIY (สูตรคำนวณ: หน่วย × NAV/หน่วย)</p>
      </div>
      <button onclick="toggleModal(true)" class="bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-orange-500/20 transition-all active:scale-95">
        + เพิ่มแผนการลงทุน
      </button>
    </div>

    <!-- Summary Card -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-xl relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-40 h-40 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <p class="text-xs font-medium text-slate-400 tracking-wider uppercase">มูลค่าทรัพย์สินสุทธิรวม</p>
      <h2 id="total-balance" class="text-3xl sm:text-5xl font-black text-white mt-1 tracking-tight">฿0.00</h2>
      
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mt-6 pt-5 border-t border-slate-800/80 text-xs sm:text-sm">
        <div>
          <p class="text-slate-400 font-normal">ต้นทุนรวม</p>
          <p id="total-cost" class="text-base font-semibold mt-1 text-slate-200">฿0.00</p>
        </div>
        <div>
          <p class="text-slate-400 font-normal">กำไร/ขาดทุนสะสม</p>
          <p id="total-profit" class="text-base font-bold mt-1 text-emerald-400">฿0.00 (0.00%)</p>
        </div>
      </div>
    </div>

    <!-- Table Card -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-2xl overflow-x-auto backdrop-blur-xl">
      <div id="loading" class="text-center py-8 text-slate-400 text-sm">กำลังโหลดข้อมูลจาก Supabase...</div>
      <table class="w-full text-xs sm:text-sm text-left">
        <thead>
          <tr class="border-b border-slate-800 text-slate-400 font-semibold uppercase tracking-wider text-[11px]">
            <th class="pb-3.5 px-2">แผน/นโยบาย</th>
            <th class="pb-3.5 px-2 text-center">จำนวนหน่วย</th>
            <th class="pb-3.5 px-2 text-right text-amber-400">NAV/หน่วย (บาท)</th>
            <th class="pb-3.5 px-2 text-right">มูลค่ารวมวันนี้ (บาท)</th>
            <th class="pb-3.5 px-2 text-right">กำไร/ขาดทุน (%)</th>
            <th class="pb-3.5 px-2 text-right">YTD (%)</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-slate-800/60 font-medium"></tbody>
      </table>
    </div>

  </div>

  <!-- Modal สำหรับเพิ่มข้อมูล -->
  <div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <h3 class="font-bold text-lg mb-4 text-white">เพิ่มแผนการลงทุนใหม่</h3>
      <form id="add-form" onsubmit="handleAddPolicy(event)" class="space-y-3.5 text-xs sm:text-sm">
        <div>
          <label class="block mb-1 text-slate-300">รหัสแผน (เช่น MPF23)</label>
          <input id="input-code" type="text" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-2.5 text-white outline-none focus:border-orange-500 transition-colors">
        </div>
        <div>
          <label class="block mb-1 text-slate-300">ชื่อกองทุน (เช่น MGFPVD)</label>
          <input id="input-name" type="text" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-2.5 text-white outline-none focus:border-orange-500 transition-colors">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block mb-1 text-slate-300">จำนวนหน่วย</label>
            <input id="input-units" type="number" step="0.0001" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-2.5 text-white outline-none focus:border-orange-500 transition-colors">
          </div>
          <div>
            <label class="block mb-1 text-amber-400 font-semibold">NAV/หน่วย (บาท)</label>
            <input id="input-nav" type="number" step="0.0001" required class="w-full bg-slate-800/80 border border-amber-500/50 rounded-xl p-2.5 text-white outline-none focus:border-amber-400 transition-colors">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block mb-1 text-slate-300">ต้นทุนรวม (บาท)</label>
            <input id="input-cost" type="number" step="0.01" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-2.5 text-white outline-none focus:border-orange-500 transition-colors">
          </div>
          <div>
            <label class="block mb-1 text-slate-300">YTD (%)</label>
            <input id="input-ytd" type="number" step="0.01" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-2.5 text-white outline-none focus:border-orange-500 transition-colors">
          </div>
        </div>
        <div class="flex justify-end space-x-3 pt-5 border-t border-slate-800 mt-2">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2.5 rounded-xl text-slate-400 hover:text-white transition-colors">ยกเลิก</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-semibold shadow-lg shadow-orange-500/30 transition-all">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
